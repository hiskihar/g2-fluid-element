<!DOCTYPE html>
<html lang="en"></html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>G2 Fluid Element</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="toggle.js" defer></script>
</head>
<body>
    <div class="main">

        <div class="container">

            <div class="toggle-switch">
                <div class="track" id="track">
                    <div class="draggable" id="draggable">
                        <div class="glass-handle handle"></div>
                        <div class="solid-handle handle"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
        <filter id="displacementFilter" x="0" y="0" width="100%" height="100%" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
            <feImage 
                href="squarish-dispmap.png" 
                result="displacementMap" 
                x="0" y="0" 
                width="100%" height="100%" 
                filterUnits="userSpaceOnUse"
                primitiveUnits="objectBoundingBox"
                preserveAspectRatio="none"
            />
            <feGaussianBlur in="SourceGraphic" stdDeviation="0.01" result="blurredSource" />
            <feDisplacementMap
                in="blurredSource"
                in2="displacementMap"
                scale=".15"
                xChannelSelector="R"
                yChannelSelector="G"
                result="displaced"
            />
            <feGaussianBlur in="displaced" stdDeviation="0.005" ></feGaussianBlur>
        </filter>
        <filter id="toggle-filter" x="0" y="0" width="100%" height="100%" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
            <feImage 
                href="toggle-dispmap.png" 
                result="displacementMap" 
                x="0" y="0" 
                width="100%" height="100%" 
                filterUnits="userSpaceOnUse"
                primitiveUnits="objectBoundingBox"
                preserveAspectRatio="none"
            />
            <feGaussianBlur in="SourceGraphic" stdDeviation="0.01" result="blurredSource" />
            <feDisplacementMap
                in="blurredSource"
                in2="displacementMap"
                scale=".15"
                xChannelSelector="R"
                yChannelSelector="G"
                result="displaced"
            />
            <feGaussianBlur in="displaced" stdDeviation="0.005" ></feGaussianBlur>
        </filter>
        <filter id="text-filter" x="0" y="0" width="100%" height="100%" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
            <feImage 
                href="h1_dispmap.png" 
                result="displacementMap" 
                x="0" y="0" 
                width="100%" height="100%" 
                filterUnits="userSpaceOnUse"
                primitiveUnits="objectBoundingBox"
                preserveAspectRatio="none"
            />
            <feDisplacementMap
                in="SourceGraphic"
                in2="displacementMap"
                scale=".15"
                xChannelSelector="R"
                yChannelSelector="G"
                result="displaced"
            />
        </filter>
    </svg>
</body>
