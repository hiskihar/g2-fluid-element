<!DOCTYPE html>
<html lang="en"></html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>G2 Fluid Element</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="main">

        <div class="container">

            

        </div>

    </div>

    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
        <filter id="displacementFilter" x="0" y="0" width="100%" height="100%" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
            <feImage 
                href="squarish-dispmap.png" 
                result="displacementMap" 
                x="0" y="0" 
                width="100%" height="100%" 
                filterUnits="userSpaceOnUse"
                primitiveUnits="objectBoundingBox"
                preserveAspectRatio="none"
            />
            <feGaussianBlur in="SourceGraphic" stdDeviation="0.006" result="blurredSource" />
            <feDisplacementMap
                in="blurredSource"
                in2="displacementMap"
                scale=".2"
                xChannelSelector="R"
                yChannelSelector="G" />
        </filter>
    </svg>
</body>
